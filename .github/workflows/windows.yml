name: Windows build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name NAS115Sync --collect-submodules watchdog --collect-submodules oss2 NAS115Sync.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: NAS115Sync-windows
          path: dist/NAS115Sync
